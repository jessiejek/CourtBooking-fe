<ion-content class="ion-padding">
  <div class="scoreboard">
    <div class="scoreboard__header">
      <h1 class="scoreboard__title">Live Match</h1>
      <span class="scoreboard__status badge badge--success">LIVE</span>
    </div>

    <div class="scoreboard__display">
      <div class="team-score">
        <span class="team-label">Team A</span>
        <span class="team-points">0</span>
      </div>
      <span class="score-divider">vs</span>
      <div class="team-score">
        <span class="team-label">Team B</span>
        <span class="team-points">0</span>
      </div>
    </div>

    <div class="scoreboard__info">
      <p>Sport: Pickleball</p>
      <p>Rule Set: Side-Out to 11</p>
      <p>Game: 1 of 3</p>
    </div>

    <div class="scoreboard__placeholder">
      <ion-icon name="tv-outline"></ion-icon>
      <p>Live scoreboard display coming in the next phase.</p>
    </div>
  </div>
</ion-content>

<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-page">
    <div class="auth-card">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to manage your scoring.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
        <ion-item class="form-field" lines="none">
          <ion-label position="stacked">Email</ion-label>
          <ion-input formControlName="email" type="email" placeholder="you@example.com" autocomplete="email"></ion-input>
        </ion-item>

        <ion-item class="form-field" lines="none">
          <ion-label position="stacked">Password</ion-label>
          <ion-input formControlName="password" type="password" autocomplete="current-password"></ion-input>
        </ion-item>

        <div class="form-error" *ngIf="error">{{ error }}</div>

        <ion-button type="submit" expand="block" class="btn-primary" [disabled]="form.invalid || loading">
          <ion-spinner *ngIf="loading" name="dots"></ion-spinner>
          <span *ngIf="!loading">Sign In</span>
        </ion-button>
      </form>

      <div class="social-divider"><span>Or continue with</span></div>

      <!-- Google official button -->
      <div class="google-signin">
        <div
          #googleButton
          class="google-signin__button"
          *ngIf="canUseGoogleLogin && !googleSdkError"
        ></div>

        <ion-button
          *ngIf="!canUseGoogleLogin || googleSdkError"
          expand="block"
          fill="outline"
          type="button"
          (click)="onGoogleFallbackClick()"
          [disabled]="googleLoading || facebookLoading"
        >
          {{ googleSdkError ? 'Retry Google Sign-In' : 'Continue with Google' }}
        </ion-button>

        <div class="google-status" *ngIf="googleLoading">
          <ion-spinner name="dots"></ion-spinner>
          <span>Finishing Google sign-in...</span>
        </div>

        <p class="form-error" *ngIf="googleSdkError">{{ googleSdkError }}</p>
      </div>

      <!-- Facebook button -->
      <div class="social-buttons">
        <ion-button expand="block" fill="outline" (click)="onFacebookLogin()" [disabled]="facebookLoading || googleLoading">
          <ion-spinner *ngIf="facebookLoading" name="dots"></ion-spinner>
          <span *ngIf="!facebookLoading">Continue with Facebook</span>
        </ion-button>
      </div>

      <p class="auth-link">
        Don't have an account? <a routerLink="/auth/register">Create one</a>
      </p>
    </div>
  </div>
</ion-content>

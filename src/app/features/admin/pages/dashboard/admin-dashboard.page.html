<ion-content class="ion-padding">
  <div class="dashboard">
    <h1 class="page-title">Admin Dashboard</h1>
    <p class="page-subtitle">Manage courts, settings, and users.</p>

    <div class="dashboard-grid">
      <ion-card routerLink="/settings" class="dashboard-card">
        <ion-card-header>
          <ion-icon name="settings-outline" class="card-icon"></ion-icon>
          <ion-card-title>Scoring Settings</ion-card-title>
        </ion-card-header>
        <ion-card-content>Configure scoring rules and booking requirements.</ion-card-content>
      </ion-card>

      <ion-card routerLink="/score/history" class="dashboard-card">
        <ion-card-header>
          <ion-icon name="stats-chart-outline" class="card-icon"></ion-icon>
          <ion-card-title>Match History</ion-card-title>
        </ion-card-header>
        <ion-card-content>View all matches across the facility.</ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
